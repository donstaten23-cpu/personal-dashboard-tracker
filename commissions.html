<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Commissions</title>
<meta name="description" content="Custom portraits, logos and line art. See the work, prices and how to request a commission." />
<style>
  @font-face {
    font-family: 'Asap';
    src: url('Asap_VariableFont_wdth_wght.ttf') format('truetype');
    font-weight: 100 900; font-style: normal; font-display: swap;
  }
  :root {
    --bg: #D6D7DA; --tile: #FFFFFF; --ink: #16181D; --ink-2: #4A505A; --ink-3: #80868F;
    --line: #E4E6E9; --pill-line: #CDD0D5; --accent: #E8643A; --open: #2E8B57; --closed: #B33A3A;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: 'Asap', system-ui, -apple-system, sans-serif; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }

  .wrap { max-width: 980px; margin: 0 auto; padding: 40px 20px 60px; display: grid; gap: 20px; }
  .tile { background: var(--tile); border-radius: 20px; padding: 26px 28px; min-width: 0; }
  h2 { font-size: 22px; font-weight: 700; letter-spacing: -.01em; margin: 0 0 16px; }
  .eyebrow { font-size: 12px; text-transform: uppercase; letter-spacing: .12em; color: var(--accent); font-weight: 700; }

  /* Header */
  .hero-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
  .badge { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--pill-line); border-radius: 999px; padding: 6px 14px; font-size: 13px; font-weight: 700; }
  .badge::before { content: ''; width: 9px; height: 9px; border-radius: 50%; background: var(--dot); }
  .badge.open { --dot: var(--open); color: var(--open); }
  .badge.closed { --dot: var(--closed); color: var(--closed); }
  .hero-name { font-size: 40px; font-weight: 800; letter-spacing: -.02em; line-height: 1.1; margin: 0 0 6px; }
  .hero-pitch { font-size: 18px; color: var(--ink-2); margin: 0 0 14px; }
  .hero-bio { font-size: 16px; line-height: 1.65; margin: 0 0 18px; max-width: 700px; }
  .btn { display: inline-block; background: var(--accent); color: #fff; font-weight: 700; font-size: 15px; padding: 12px 22px; border-radius: 12px; }
  .btn:hover { text-decoration: none; filter: brightness(.95); }
  .btn.ghost { background: transparent; color: var(--accent); border: 1px solid var(--accent); }

  /* Hero (headline + collage) */
  .hero { display: grid; grid-template-columns: 1.05fr 1fr; gap: 28px; align-items: center; }
  .hero-title { font-size: 58px; font-weight: 800; letter-spacing: -.03em; line-height: .98; margin: 6px 0 12px; text-transform: uppercase; }
  .hero-title em { font-style: normal; color: var(--accent); display: block; }
  .hero-title.closed em { color: var(--closed); }
  .collage { position: relative; height: 310px; }
  .collage img { position: absolute; width: 38%; aspect-ratio: 3/4; object-fit: cover; border: 5px solid #fff; border-radius: 10px; box-shadow: 0 8px 22px rgba(22,24,29,.22); background: #F6F7F8; }
  .collage img:nth-child(1) { left: 0;   top: 12%; transform: rotate(-6deg); }
  .collage img:nth-child(2) { left: 20%; top: 0;   transform: rotate(3deg);  z-index: 2; }
  .collage img:nth-child(3) { left: 42%; top: 16%; transform: rotate(-3deg); z-index: 3; }
  .collage img:nth-child(4) { left: 62%; top: 2%;  transform: rotate(7deg);  z-index: 4; }

  /* Meet the artist */
  .artist { display: grid; grid-template-columns: 1fr; gap: 22px; align-items: center; }
  .artist.has-photo { grid-template-columns: 260px 1fr; }
  .artist-photo { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 16px; border: 1px solid var(--line); }
  .facts { list-style: none; margin: 14px 0 0; padding: 0; display: grid; gap: 8px; }
  .facts li { font-size: 14.5px; color: var(--ink-2); }
  .facts b { display: inline-block; min-width: 92px; color: var(--ink); }

  /* Portrait price grid */
  .pgrid-title { font-size: 13px; text-transform: uppercase; letter-spacing: .1em; color: var(--ink-3); font-weight: 700; margin: 0 0 4px; }
  .pgrid-sub { font-size: 14px; color: var(--ink-2); margin: 0 0 12px; line-height: 1.5; }
  .pgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .pcell { border: 1px solid var(--line); border-radius: 16px; padding: 18px; text-align: center; background: #FBFBFC; }
  .pcell .size { font-size: 15px; font-weight: 700; color: var(--ink-2); }
  .pcell .amt { font-size: 38px; font-weight: 800; color: var(--accent); letter-spacing: -.02em; line-height: 1.15; }

  /* Gallery */
  .group-title { font-size: 13px; text-transform: uppercase; letter-spacing: .1em; color: var(--ink-3); font-weight: 700; margin: 22px 0 10px; }
  .group-title:first-of-type { margin-top: 0; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .shot { border: none; background: none; padding: 0; cursor: zoom-in; text-align: left; font: inherit; color: inherit; }
  .shot img { width: 100%; aspect-ratio: 1; object-fit: cover; object-position: center 25%; border-radius: 12px; display: block; border: 1px solid var(--line); background: #F6F7F8; }
  .shot span { display: block; font-size: 13px; color: var(--ink-2); margin-top: 6px; line-height: 1.4; }
  .empty { color: var(--ink-3); font-size: 14px; }
  .lightbox { position: fixed; inset: 0; background: rgba(16,18,22,.9); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 24px; z-index: 10; cursor: zoom-out; }
  .lightbox img { max-width: 100%; max-height: 82vh; border-radius: 10px; background: #fff; }
  .lightbox p { color: #fff; margin: 0; font-size: 14px; text-align: center; }

  /* Services */
  .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .card { border: 1px solid var(--line); border-radius: 16px; padding: 20px; display: flex; flex-direction: column; }
  .card h3 { margin: 0 0 4px; font-size: 18px; }
  .price { font-size: 26px; font-weight: 800; color: var(--accent); margin: 0 0 12px; }
  .price small { font-size: 12px; font-weight: 600; color: var(--ink-3); text-transform: uppercase; letter-spacing: .06em; display: block; }
  .card ul { list-style: none; margin: 0; padding: 0; }
  .card li { position: relative; padding-left: 18px; font-size: 14px; line-height: 1.55; color: var(--ink-2); margin-bottom: 7px; }
  .card li::before { content: ''; position: absolute; left: 3px; top: .6em; width: 7px; height: 7px; border-radius: 50%; background: #C9CCD1; }

  /* How it works + terms */
  ol.steps { list-style: none; counter-reset: s; margin: 0; padding: 0; display: grid; gap: 14px; }
  ol.steps li { counter-increment: s; display: grid; grid-template-columns: 34px 1fr; gap: 12px; align-items: start; font-size: 15px; line-height: 1.55; color: var(--ink-2); }
  ol.steps li::before { content: counter(s); width: 34px; height: 34px; border-radius: 50%; background: var(--accent); color: #fff; font-weight: 800; display: grid; place-items: center; }
  ol.steps b { color: var(--ink); }
  .terms { margin: 0; padding-left: 18px; font-size: 14.5px; line-height: 1.65; color: var(--ink-2); }
  .terms li { margin-bottom: 8px; }

  /* Form */
  .form-frame { width: 100%; height: 900px; border: 1px solid var(--line); border-radius: 12px; display: block; margin-bottom: 14px; }
  .notice { background: #FFF4EE; border: 1px solid #E8643A66; border-radius: 12px; padding: 14px 18px; color: #9A3A16; font-size: 13px; line-height: 1.6; margin-bottom: 14px; }
  .notice code { background: #fff; padding: 2px 6px; border-radius: 4px; }

  @media (max-width: 720px) {
    .wrap { padding: 20px 16px 40px; gap: 14px; }
    .tile { padding: 22px 20px; border-radius: 16px; }
    .hero { grid-template-columns: 1fr; gap: 18px; }
    .hero-title { font-size: 42px; }
    .collage { height: 235px; }
    .artist.has-photo { grid-template-columns: 1fr; }
    .artist-photo { max-width: 260px; }
    .grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .cards { grid-template-columns: 1fr; }
    .btn { display: block; text-align: center; }
    .form-frame { height: 1100px; }
  }
</style>
</head>
<body>
<main class="wrap" id="root"></main>

<script>
/* ============================================================
   EDIT EVERYTHING HERE. The page below builds itself from this.
   Anything still in [square brackets] is a placeholder to fill in.
   ============================================================ */
var STATUS = "open";   // <-- the one word to flip: "open" or "closed"

var SITE = {
  name:  "Donovan",
  pitch: "Custom portraits, logos, and line art",
  // Optional: a picture of you (a self-portrait or a photo at your desk). Put it in art/ and set e.g. photo: "art/artist.jpg".
  photo: "",
  bio:   "I am a self taught artist who has been sketching for years. My speciality are physical portraits done with pencil, but I also enjoy character art, digital art, as well as logos.",
  // Google Form: Send > the <> tab > copy the src="..." link from the iframe code (ends in ?embedded=true)
  formUrl: "https://docs.google.com/forms/d/e/1FAIpQLScTRkI-VNCW_jTd8Kw-rAlUD8RuvT38UtnjmmoHxGm-6Lxkow/viewform?embedded=true"
};

// group must match one of GROUPS. src is a file in the art/ folder.
// Four pictures for the tilted collage at the top (files in art/, small versions are used).
var HERO = ["art/portrait-06.jpg", "art/digital-02.jpg", "art/portrait-01.jpg", "art/portrait-05.jpg"];

// A few quick facts shown beside the bio.
var FACTS = [
  ["Specialty", "Pencil portraits"],
  ["Also", "Digital art, character art, logos"]
];

// Pencil portrait price grid (one person, personal use). Add a size by adding a line.
var PORTRAIT_SIZES = [
  { size: "8.5 x 11 in", price: "$150" },
  { size: "11 x 14 in",  price: "$250" }
];

var GROUPS = ["Portraits", "Digital art", "Logos", "Line art"];
// Each picture has a full-size file (src) and a small one for the grid (art/<same name>-sm.jpg).
var GALLERY = [
  { group: "Portraits", src: "art/portrait-01.jpg", caption: "Graphite portrait, eyes closed" },
  { group: "Portraits", src: "art/portrait-02.jpg", caption: "Pencil portrait, long hair" },
  { group: "Portraits", src: "art/portrait-03.jpg", caption: "Pencil portrait with a soda bottle" },
  { group: "Portraits", src: "art/portrait-04.jpg", caption: "Pencil portrait, curly hair" },
  { group: "Portraits", src: "art/portrait-05.jpg", caption: "Low-angle pencil portrait" },
  { group: "Portraits", src: "art/portrait-06.jpg", caption: "Close-up graphite portrait" },
  { group: "Portraits", src: "art/portrait-07.jpg", caption: "Couple portrait" },
  { group: "Portraits", src: "art/portrait-08.jpg", caption: "Pencil and ink portrait, cap" },
  { group: "Portraits", src: "art/portrait-09.jpg", caption: "Pencil portrait with watch" },
  { group: "Portraits", src: "art/portrait-10.jpg", caption: "Profile portrait, hair up" },
  { group: "Digital art", src: "art/digital-01.jpg", caption: "Digital portrait" },
  { group: "Digital art", src: "art/digital-02.jpg", caption: "Digital portrait, blue palette" },
  { group: "Logos", src: "art/logo-01.jpg", caption: "Pharaoh Galactic Metals, full logo" },
  { group: "Logos", src: "art/logo-02.jpg", caption: "Pharaoh Galactic Metals, separated elements" },
  { group: "Logos", src: "art/logo-03.jpg", caption: "Galactic Metals, stacked logo" },
  { group: "Logos", src: "art/logo-04.jpg", caption: "Braids By Nauja" }
];

var OFFERINGS = [
  { name: "Digital art", price: "Quote", includes: ["Priced per piece because it takes longer", "Final price quoted after your request"] },
  { name: "Logos",       price: "$400",  includes: ["Main logo: your full, primary design", "Alternative logo: a variation for other uses, such as a stacked or horizontal layout", "Simplified logo: a clean, minimal version for small sizes, icons and one-color use", "Final price quoted after your request, based on complexity"] },
  { name: "Line art",    price: "Quote", includes: ["Final price quoted after your request"] }
];

var STEPS = [
  ["Request",   "Fill out the form below with what you want and any references."],
  ["Quote",     "I reply by email with a price and timeline."],
  ["Deposit",   "A 50% deposit by Zelle or Cash App locks in your spot. I'll send the details once you accept the quote."],
  ["Drafts",    "You see early drafts so we're on track before the final."],
  ["Revisions", "Ask for changes. Five revisions per design are included."],
  ["Delivery",  "Final files sent after the remaining balance is paid."]
];

var TERMS = [
  "Payment: 50% up front to start, the rest when the work is complete. Zelle or Cash App.",
  "Revisions: 5 revisions per design are included. Additional revisions are $10 each.",
  "Rights: portraits and digital art are for personal use. Logos include full rights to use the design, including commercial use. Commercial use of a portrait can be arranged, so ask for a quote. I keep the right to show finished work in my portfolio.",
  "Cancellations: either of us can cancel at any time. The deposit is non-refundable if you cancel after work has begun."
];
/* ============================================================ */

function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }

var isOpen = STATUS === "open";
var gallery = GROUPS.map(function (g) {
  var items = GALLERY.filter(function (x) { return x.group === g; });
  if (!items.length) return "";
  return '<div class="group-title">' + esc(g) + '</div><div class="grid">' + items.map(function (x) {
    return '<button class="shot" data-src="' + esc(x.src) + '" data-cap="' + esc(x.caption) + '">' +
      '<img src="' + esc(x.src.replace(/\.jpg$/, "-sm.jpg")) + '" alt="' + esc(x.caption) + '" loading="lazy" decoding="async" /><span>' + esc(x.caption) + '</span></button>';
  }).join("") + "</div>";
}).join("") || '<div class="empty">Work coming soon.</div>';

var formBlock = SITE.formUrl
  ? '<iframe class="form-frame" src="' + esc(SITE.formUrl) + '" title="Commission request form" loading="lazy">Loading…</iframe>' +
    '<a class="btn ghost" href="' + esc(SITE.formUrl.replace("?embedded=true", "")) + '" target="_blank" rel="noopener">Open the form on its own page</a>'
  : '<div class="notice">The request form isn’t connected yet. Paste the Google Form link into <code>formUrl</code> at the top of this file.</div>';

var heroImgs = HERO.map(function (f) {
  return '<img src="' + esc(f.replace(/\.jpg$/, "-sm.jpg")) + '" alt="" loading="eager" decoding="async" />';
}).join("");

var portraitGrid = '<p class="pgrid-title">Pencil portraits</p><p class="pgrid-sub">One person, personal use. Price depends on the size of the drawing.</p><div class="pgrid">' +
  PORTRAIT_SIZES.map(function (z) {
    return '<div class="pcell"><div class="size">' + esc(z.size) + '</div><div class="amt">' + esc(z.price) + '</div></div>';
  }).join("") + '</div>';

var cards = OFFERINGS.map(function (o) {
  var from = /^\$/.test(o.price);
  return '<div class="card"><h3>' + esc(o.name) + '</h3><p class="price">' + (from ? '<small>Starting at</small>' : '<small>Custom</small>') + esc(o.price) + '</p><ul>' +
    o.includes.map(function (i) { return "<li>" + esc(i) + "</li>"; }).join("") + "</ul></div>";
}).join("");

document.getElementById("root").innerHTML =
  '<section class="tile"><div class="hero"><div>' +
    '<span class="eyebrow">' + esc(SITE.name) + '</span>' +
    '<h1 class="hero-title ' + (isOpen ? "open" : "closed") + '">Commissions<em>' + (isOpen ? "Open" : "Closed") + '</em></h1>' +
    '<p class="hero-pitch">' + esc(SITE.pitch) + '</p>' +
    (isOpen ? '<a class="btn" href="#request">Request a commission</a>' : '<p class="empty">Not taking requests right now. Check back soon.</p>') +
    '</div><div class="collage" aria-hidden="true">' + heroImgs + '</div></div></section>' +
  '<section class="tile"><h2>Work</h2>' + gallery + '</section>' +
  '<section class="tile"><h2>Meet the artist</h2><div class="artist' + (SITE.photo ? " has-photo" : "") + '">' +
    (SITE.photo ? '<img class="artist-photo" src="' + esc(SITE.photo) + '" alt="' + esc(SITE.name) + '" />' : "") +
    '<div><p class="hero-bio" style="margin:0">' + esc(SITE.bio) + '</p><ul class="facts">' + FACTS.map(function (f) {
      return "<li><b>" + esc(f[0]) + "</b> " + esc(f[1]) + "</li>";
    }).join("") + '</ul></div></div></section>' +
  '<section class="tile"><h2>Services and prices</h2>' + portraitGrid + '<div class="cards">' + cards + '</div></section>' +
  '<section class="tile"><h2>How it works</h2><ol class="steps">' + STEPS.map(function (s) {
    return "<li><div><b>" + esc(s[0]) + ".</b> " + esc(s[1]) + "</div></li>";
  }).join("") + '</ol></section>' +
  '<section class="tile"><h2>Terms in short</h2><ul class="terms">' + TERMS.map(function (t) { return "<li>" + esc(t) + "</li>"; }).join("") + '</ul></section>' +
  (isOpen ? '<section class="tile" id="request"><h2>Request a commission</h2>' + formBlock + '</section>' : "");

// Tap a picture to enlarge it; tap again to close.
document.addEventListener("click", function (e) {
  var shot = e.target.closest(".shot");
  if (shot) {
    var lb = document.createElement("div");
    lb.className = "lightbox";
    lb.innerHTML = '<img src="' + esc(shot.dataset.src) + '" alt="' + esc(shot.dataset.cap) + '" /><p>' + esc(shot.dataset.cap) + "</p>";
    document.body.appendChild(lb);
  } else if (e.target.closest(".lightbox")) {
    e.target.closest(".lightbox").remove();
  }
});
document.addEventListener("keydown", function (e) { if (e.key === "Escape") { var l = document.querySelector(".lightbox"); if (l) l.remove(); } });
</script>
</body>
</html>
