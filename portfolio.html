<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Portfolio</title>
<style>
  @font-face {
    font-family: 'Asap';
    src: url('Asap_VariableFont_wdth_wght.ttf') format('truetype');
    font-weight: 100 900; font-style: normal; font-display: swap;
  }
  :root {
    --bg: #D6D7DA; --tile: #FFFFFF; --ink: #16181D; --ink-2: #4A505A; --ink-3: #80868F;
    --line: #E4E6E9; --pill-line: #CDD0D5; --accent: #E8643A;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: 'Asap', system-ui, -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }

  .wrap { max-width: 980px; margin: 0 auto; padding: 40px 20px 60px; }
  .bento { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .tile { background: var(--tile); border-radius: 20px; padding: 26px 28px; min-width: 0; }
  .span-2 { grid-column: 1 / -1; }

  /* Intro tile */
  .hero-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
  .eyebrow { font-size: 12px; text-transform: uppercase; letter-spacing: .12em; color: var(--accent); font-weight: 700; }
  .pill { border: 1px solid var(--pill-line); border-radius: 10px; padding: 6px 12px; font-size: 13px; color: var(--ink); text-align: center; line-height: 1.3; }
  .hero-name { font-size: 40px; font-weight: 800; letter-spacing: -.02em; line-height: 1.1; margin: 0 0 6px; }
  .hero-sub { font-size: 16px; color: var(--ink-2); margin-bottom: 16px; }
  .hero-intro { font-size: 17px; line-height: 1.65; margin: 0; max-width: 780px; }

  /* Label + chips rows (toolkit, contact) */
  .row-tile { display: flex; align-items: center; gap: 14px 20px; flex-wrap: wrap; }
  .row-label { font-weight: 700; font-size: 16px; white-space: nowrap; }
  .chips { display: flex; flex-wrap: wrap; gap: 10px; }
  .chip { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); border-radius: 10px; padding: 8px 14px; font-size: 14px; color: var(--ink); background: var(--tile); }
  a.chip:hover { border-color: var(--ink-3); text-decoration: none; }
  .chip svg { width: 18px; height: 18px; flex-shrink: 0; }

  /* Project tiles */
  .proj { display: flex; flex-direction: column; }
  .proj-head { padding-bottom: 16px; border-bottom: 1px solid var(--line); margin-bottom: 16px; }
  .proj-head .pill { display: inline-block; font-size: 12px; padding: 4px 10px; margin-bottom: 12px; color: var(--ink-2); }
  .proj-head h2 { font-size: 22px; font-weight: 700; letter-spacing: -.01em; margin: 0 0 4px; line-height: 1.25; }
  .proj-meta { font-size: 14px; color: var(--ink-2); }
  .proj-desc { font-size: 14.5px; line-height: 1.65; color: var(--ink-2); margin: 0 0 12px; }
  .proj ul { list-style: none; margin: 0 0 4px; padding: 0; }
  .proj li { position: relative; padding-left: 20px; font-size: 14px; line-height: 1.55; color: var(--ink-2); margin-bottom: 8px; }
  .proj li::before { content: ''; position: absolute; left: 4px; top: .6em; width: 7px; height: 7px; border-radius: 50%; background: #C9CCD1; }
  .metrics { display: flex; gap: 10px; flex-wrap: wrap; margin: 16px 0 4px; }
  .metric { border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; min-width: 100px; }
  .metric-num { display: block; font-size: 22px; font-weight: 800; color: var(--accent); line-height: 1.15; }
  .metric-lbl { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); }
  .tools { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 16px; }
  .port-tool { border: 1px solid var(--line); border-radius: 8px; padding: 4px 10px; font-size: 12px; color: var(--ink-2); background: #F6F7F8; }
  /* Screenshots show as a fixed-height preview pinned to the bottom of the
     tile, so one tall image doesn't stretch its whole row; click for full size. */
  .port-img-btn { margin-top: auto; padding: 16px 0 0; border: none; background: none; cursor: zoom-in; display: block; width: 100%; }
  .port-img { width: 100%; height: 240px; object-fit: cover; object-position: top; border-radius: 12px; display: block; border: 1px solid var(--line); }
  .lightbox { position: fixed; inset: 0; background: rgba(16,18,22,.85); display: flex; align-items: center; justify-content: center; padding: 24px; z-index: 10; cursor: zoom-out; }
  .lightbox img { max-width: 100%; max-height: 100%; border-radius: 10px; background: #fff; }

  .loading { color: var(--ink-3); font-size: 14px; padding: 60px 0; text-align: center; }
  .error-banner { background: #FFF4EE; border: 1px solid #E8643A66; border-radius: 12px; padding: 16px 20px; color: #9A3A16; font-size: 13px; margin-bottom: 20px; line-height: 1.6; }
  .error-banner code { background: #FFFFFF; padding: 2px 6px; border-radius: 4px; font-family: monospace; font-size: 12px; }

  @media (max-width: 720px) {
    .wrap { padding: 20px 16px 40px; }
    .bento { grid-template-columns: 1fr; gap: 14px; }
    .span-2 { grid-column: auto; }
    .tile { padding: 22px 20px; border-radius: 16px; }
    .hero-name { font-size: 30px; }
    .hero-intro { font-size: 16px; }
  }
</style>
</head>
<body>
<div class="wrap" id="root">
  <div class="loading">Loading portfolio…</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/*
  PUBLIC PORTFOLIO PAGE
  =====================
  This page reads your portfolio content from Supabase and renders it
  without requiring any login.

  SETUP (one time):
  1. Open your Supabase project → SQL Editor and run:

     CREATE POLICY "Public portfolio read" ON dashboard_data
       FOR SELECT
       USING (
         tab_key IN ('portfolio-content') OR
         tab_key LIKE 'portfolio-img-%'
       );

  2. Fill in YOUR_USER_ID below with your Supabase user ID.
     You can find it in Supabase → Authentication → Users, or
     by opening the dashboard app and checking the browser console.

  3. Fill in SUPABASE_URL and SUPABASE_ANON_KEY (same values as in index.html).
*/

var SUPABASE_URL     = "https://rqlnwomkrmhxffzzngyi.supabase.co";
var SUPABASE_ANON_KEY = "sb_publishable_f1oApcIXVoxrcRB5_WSSAQ_HRLfqXE8";
var USER_ID          = "bc337488-7a30-459f-9a22-1c6a36812340";   // <-- paste your Supabase user ID here

// ─── Default content (shown when Supabase data hasn't loaded yet) ───────────
// This mirrors the static HTML in index.html so the page looks right
// even before any edits have been saved from the dashboard.
var DEFAULT_CONTENT = {
  "port-eyebrow":   "Systems &amp; Implementation",
  "port-title":     "Work Portfolio",
  "port-subtitle":  "PMP-Certified Implementation &amp; Business Systems Professional",
  "port-intro":     "A working record of the systems implementations, platform integrations, and process automation projects I&#8217;ve owned end-to-end &#8212; built to show <span style=\"color:#E8643A;\">how</span> I approach problems, not just what&#8217;s on a resume line.",
  "c1-tag":   "SaaS Marketplace Implementation",
  "c1-title": "Channel Engine Multi-Marketplace Integration",
  "c1-meta":  "Sylvane, Inc. &#8212; Project Lead &amp; Platform SME",
  "c1-desc":  "Led the implementation and ongoing administration of Channel Engine, a SaaS marketplace integration platform connecting our Shopify storefront and NetSuite ERP to four major marketplaces. Owned data mapping, cross-functional coordination, and internal training.",
  "c1-bullets": "<li>Data mapping across Shopify, NetSuite, and four marketplace schemas</li><li>Cross-functional coordination across operations, merchandising, and IT</li><li>Independently launched the Best Buy integration during a leadership absence</li>",
  "c1-m1-num": "3,000+", "c1-m1-lbl": "SKUs Onboarded",
  "c1-m2-num": "4",      "c1-m2-lbl": "Marketplaces",
  "c1-m3-num": "$60K+",  "c1-m3-lbl": "New Channel Revenue",
  "c1-tools": "<span class=\"port-tool\">Channel Engine</span><span class=\"port-tool\">Shopify</span><span class=\"port-tool\">NetSuite</span><span class=\"port-tool\">EDI</span>",
  "c2-tag":   "Custom Application Build",
  "c2-title": "Automated Inventory Re-Order System",
  "c2-meta":  "Sylvane, Inc. &#8212; Designer &amp; Builder",
  "c2-desc":  "Designed and built a custom inventory reorder application in Google Sheets, integrating live data from our internal reporting tool and NetSuite. The system calculates weighted weeks-of-supply and suggested order quantities automatically.",
  "c2-bullets": "<li>Live data integration via automated hourly refresh from reporting tool and NetSuite</li><li>Custom weighted sales algorithm for Weeks of Supply prioritizing recent trends</li><li>Google Apps Script automation for reorder worksheet and PO generation</li>",
  "c2-tools": "<span class=\"port-tool\">Google Sheets</span><span class=\"port-tool\">Google Apps Script</span><span class=\"port-tool\">NetSuite</span><span class=\"port-tool\">Shopify</span>",
  "c3-tag":   "Government Contract Systems",
  "c3-title": "GSA Contract Tracking &amp; Modification Workbook",
  "c3-meta":  "Sylvane, Inc. &#8212; Builder &amp; Administrator",
  "c3-desc":  "Built and maintain an Excel-based tracking workbook for GSA Multiple Award Schedule contract modifications, used to coordinate compliance deadlines, pricing updates, and documentation across operations and merchandising.",
  "c3-m1-num": "4+", "c3-m1-lbl": "Modifications / Year",
  "c3-tools": "<span class=\"port-tool\">Excel</span><span class=\"port-tool\">SharePoint</span><span class=\"port-tool\">OneDrive</span>",
  "c4-tag":   "Platform Migration",
  "c4-title": "Shopify-to-NetSuite Systems Migration",
  "c4-meta":  "Sylvane, Inc. &#8212; Merchandising Systems Lead",
  "c4-desc":  "Led the merchandising systems workstream of a company-wide Shopify-to-NetSuite platform migration, building the bulk import templates and documentation that became the team&#8217;s standard workflow for inventory and pricing updates.",
  "c4-m1-num": "10+", "c4-m1-lbl": "NetSuite Templates Built",
  "c4-tools": "<span class=\"port-tool\">NetSuite</span><span class=\"port-tool\">Shopify</span><span class=\"port-tool\">Matrixify</span>",
  "c5-tag":   "Personal Project",
  "c5-title": "Personal Life Dashboard",
  "c5-meta":  "Self-built &#8212; Vanilla JS / Supabase / GitHub Pages",
  "c5-desc":  "Designed and built this dashboard from scratch &#8212; a multi-tab personal finance and wellness tracker with real-time Supabase sync, multi-trip travel planning, budget forecasting against pay periods, and workout session logging with lift tracking.",
  "c5-tools": "<span class=\"port-tool\">HTML / CSS / JS</span><span class=\"port-tool\">Supabase</span><span class=\"port-tool\">GitHub Pages</span>",
  "port-footer": "Donovan Staten &#8212; <a href=\"mailto:donstaten23@gmail.com\" style=\"color:#E8643A;text-decoration:none;\">donstaten23@gmail.com</a> &#183; (470) 927-4077 &#183; <a href=\"https://linkedin.com/in/donovanstaten\" style=\"color:#E8643A;text-decoration:none;\" target=\"_blank\">LinkedIn</a>"
};

var CARD_PREFIXES = ['c1', 'c2', 'c3', 'c4', 'c5'];

// ─── Render ─────────────────────────────────────────────────────────────────

function k(key) {
  return (window._content && window._content[key]) ? window._content[key] : (DEFAULT_CONTENT[key] || '');
}

function img(imageKey) {
  var src = window._images && window._images[imageKey];
  return src ? '<button type="button" class="port-img-btn" title="View full size"><img class="port-img" src="' + src + '" alt="" /></button>' : '';
}

document.addEventListener('click', function (e) {
  var open = document.querySelector('.lightbox');
  if (open) { open.remove(); return; }
  var btn = e.target.closest && e.target.closest('.port-img-btn');
  if (!btn) return;
  var box = document.createElement('div');
  box.className = 'lightbox';
  box.innerHTML = '<img alt="" />';
  box.firstChild.src = btn.querySelector('img').src;
  document.body.appendChild(box);
});
document.addEventListener('keydown', function (e) {
  var open = document.querySelector('.lightbox');
  if (open && e.key === 'Escape') open.remove();
});

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

function _htmlToEl(html) {
  var d = document.createElement('div');
  d.innerHTML = html;
  return d;
}

var ICONS = {
  person: '<svg viewBox="0 0 24 24" fill="none" stroke="#5B8FA8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>',
  mail:   '<svg viewBox="0 0 24 24" fill="none" stroke="#3B82F6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>',
  phone:  '<svg viewBox="0 0 24 24" fill="none" stroke="#E8A13A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg>',
  linkedin: '<svg viewBox="0 0 24 24"><rect width="24" height="24" rx="4" fill="#0A66C2"/><path fill="#fff" d="M7 9.5h2.5V18H7zM8.25 5.5a1.45 1.45 0 1 1 0 2.9 1.45 1.45 0 0 1 0-2.9zM11 9.5h2.4v1.2c.4-.7 1.3-1.4 2.7-1.4 2.6 0 3.1 1.7 3.1 3.9V18h-2.5v-4.2c0-1 0-2.3-1.4-2.3s-1.6 1.1-1.6 2.2V18H11z"/></svg>',
  link:   '<svg viewBox="0 0 24 24" fill="none" stroke="#80868F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg>'
};

// The dashboard stores the footer as one HTML line ("Name — email · phone ·
// LinkedIn"). Split it on — / · / | into separate pieces so each becomes its
// own contact chip, keeping any links inside a piece.
function _contactPieces() {
  var src = _htmlToEl(k('port-footer'));
  var pieces = [[]];
  Array.prototype.forEach.call(src.childNodes, function (node) {
    if (node.nodeType === 3) {
      node.textContent.split(/[—·|]/).forEach(function (part, i) {
        if (i > 0) pieces.push([]);
        if (part.trim()) pieces[pieces.length - 1].push(document.createTextNode(part.trim()));
      });
    } else {
      pieces[pieces.length - 1].push(node.cloneNode(true));
    }
  });
  return pieces.filter(function (p) { return p.length; }).map(function (nodes) {
    var holder = document.createElement('div');
    nodes.forEach(function (n) { holder.appendChild(n); });
    return holder;
  });
}

function _contactChip(holder) {
  var a = holder.querySelector('a[href]');
  var text = holder.textContent.trim();
  if (a) {
    var href = a.getAttribute('href') || '';
    var icon = /^mailto:/i.test(href) ? ICONS.mail : /linkedin\.com/i.test(href) ? ICONS.linkedin : ICONS.link;
    var external = /^https?:/i.test(href);
    return '<a class="chip" href="' + esc(href) + '"' + (external ? ' target="_blank" rel="noopener"' : '') + '>' + icon + esc(text) + '</a>';
  }
  if (/^[+()\d][\d\s().+-]{6,}$/.test(text)) {
    return '<a class="chip" href="tel:' + esc(text.replace(/[^\d+]/g, '')) + '">' + ICONS.phone + esc(text) + '</a>';
  }
  return '<span class="chip">' + ICONS.person + esc(text) + '</span>';
}

function renderPortfolio() {
  var root = document.getElementById('root');

  var setupNote = !USER_ID
    ? '<div class="error-banner">&#9888;&#65039; <strong>Setup needed:</strong> Open <code>portfolio.html</code>, fill in <code>USER_ID</code> with your Supabase user ID, then run the SQL policy shown in the comments at the top of this file.<br>Content shown below is the default placeholder text.</div>'
    : '';

  // Name comes from the first plain-text piece of the footer ("Donovan Staten"),
  // falling back to the page title if the footer doesn't start with one.
  var pieces = _contactPieces();
  var first = pieces[0];
  var name = first && !first.querySelector('a') && !/\d{3}/.test(first.textContent) ? first.textContent.trim() : '';
  var contactPieces = name ? pieces.slice(1) : pieces;
  var pageTitle = _htmlToEl(k('port-title')).textContent.trim();
  document.title = (name ? name + ' — ' : '') + (pageTitle || 'Portfolio');

  // Every tool tag across the projects, de-duplicated, for the toolkit row.
  var seen = {};
  var tools = [];
  CARD_PREFIXES.forEach(function (p) {
    _htmlToEl(k(p + '-tools')).querySelectorAll('.port-tool').forEach(function (el) {
      var t = el.textContent.trim();
      if (t && !seen[t.toLowerCase()]) { seen[t.toLowerCase()] = true; tools.push(t); }
    });
  });

  var cards = CARD_PREFIXES.filter(function (p) { return k(p + '-title'); });

  root.innerHTML = setupNote +
    '<div class="bento">' +
      '<section class="tile span-2">' +
        '<div class="hero-top">' +
          '<div class="eyebrow">' + k('port-eyebrow') + '</div>' +
          (pageTitle ? '<div class="pill">' + k('port-title') + '</div>' : '') +
        '</div>' +
        '<h1 class="hero-name">' + (name ? esc(name) : k('port-title')) + '</h1>' +
        '<div class="hero-sub">' + k('port-subtitle') + '</div>' +
        '<p class="hero-intro">' + k('port-intro') + '</p>' +
      '</section>' +

      (tools.length
        ? '<section class="tile span-2 row-tile"><div class="row-label">Toolkit &#8250;&#8250;</div><div class="chips">' +
            tools.map(function (t) { return '<span class="chip">' + esc(t) + '</span>'; }).join('') +
          '</div></section>'
        : '') +

      cards.map(function (p, i) {
        // An odd last card spans both columns instead of leaving a gap.
        var wide = i === cards.length - 1 && cards.length % 2 === 1;
        return _card(p, img('port-img-' + p.slice(1)), wide);
      }).join('') +

      (contactPieces.length
        ? '<section class="tile span-2 row-tile"><div class="row-label">Contact &#8250;&#8250;</div><div class="chips">' +
            contactPieces.map(_contactChip).join('') +
          '</div></section>'
        : '') +
    '</div>';
}

function _card(prefix, imgHtml, wide) {
  var metrics = ['m1', 'm2', 'm3'].filter(function (m) { return k(prefix + '-' + m + '-num'); }).map(function (m) {
    return '<div class="metric"><span class="metric-num">' + k(prefix + '-' + m + '-num') + '</span><span class="metric-lbl">' + k(prefix + '-' + m + '-lbl') + '</span></div>';
  }).join('');

  return '<section class="tile proj' + (wide ? ' span-2' : '') + '">' +
    '<div class="proj-head">' +
      (k(prefix + '-tag') ? '<div class="pill">' + k(prefix + '-tag') + '</div>' : '') +
      '<h2>' + k(prefix + '-title') + '</h2><div class="proj-meta">' + k(prefix + '-meta') + '</div>' +
    '</div>' +
    (k(prefix + '-desc') ? '<p class="proj-desc">' + k(prefix + '-desc') + '</p>' : '') +
    (k(prefix + '-bullets') ? '<ul>' + k(prefix + '-bullets') + '</ul>' : '') +
    (metrics ? '<div class="metrics">' + metrics + '</div>' : '') +
    (k(prefix + '-tools') ? '<div class="tools">' + k(prefix + '-tools') + '</div>' : '') +
    imgHtml +
  '</section>';
}

// ─── Load from Supabase ──────────────────────────────────────────────────────

async function loadAndRender() {
  window._content = null;
  window._images  = {};

  if (!USER_ID) {
    renderPortfolio();
    return;
  }

  if (!window.supabase) {
    document.getElementById('root').innerHTML = '<div class="error-banner">Could not load Supabase library. Check your internet connection.</div>';
    renderPortfolio();
    return;
  }

  var client;
  try {
    client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  } catch(e) {
    renderPortfolio();
    return;
  }

  try {
    // Fetch text content
    var contentResult = await client.from('dashboard_data')
      .select('data')
      .eq('user_id', USER_ID)
      .eq('tab_key', 'portfolio-content')
      .maybeSingle();
    if (contentResult.data && contentResult.data.data) {
      window._content = contentResult.data.data;
    }

    // Fetch images (each stored as its own row)
    var imgResult = await client.from('dashboard_data')
      .select('tab_key, data')
      .eq('user_id', USER_ID)
      .like('tab_key', 'portfolio-img-%');
    if (imgResult.data && imgResult.data.length) {
      imgResult.data.forEach(function(row) {
        var key = row.tab_key.replace('portfolio-img-', '');
        if (row.data && row.data.src) window._images[key] = row.data.src;
      });
    }
  } catch(e) {
    // Supabase error (likely RLS blocking anonymous reads)
    var root = document.getElementById('root');
    root.innerHTML = '<div class="error-banner">&#9888;&#65039; <strong>Could not load portfolio data.</strong> If you haven\'t set up the public read policy yet, run this in Supabase SQL Editor:<br><br>' +
      '<code>CREATE POLICY "Public portfolio read" ON dashboard_data FOR SELECT USING (tab_key IN (\'portfolio-content\') OR tab_key LIKE \'portfolio-img-%\');</code><br><br>' +
      'Then reload this page. Showing default content below.</div>' +
      root.innerHTML;
  }

  renderPortfolio();
}

loadAndRender();
</script>
</body>
</html>
